[project]
authors = [
  { name = "Utrecht University Yoda team", email = "yoda@uu.nl" }
]
dependencies = [
        "bcrypt==4.0.1",
        "email-validator==2.0.0",
        "filelock==3.20.3",
        "greenlet==3.3.1",
        "Flask==3.1.3",
        "flask-session==0.8.0",
        "Flask-SQLAlchemy==3.1.1",
        "Flask-WTF==1.2.2",
        "psycopg2-binary==2.9.10",
        "requests==2.33.0",
        "SQLAlchemy==2.0.46",
        "urllib3==2.7.0",
        "Werkzeug==3.1.6"
]
description = "Yoda External User Service"
license = "GPL-3.0-only"
name = "yoda_eus"
dynamic = ["version"]

[project.optional-dependencies]
test = [
        "pytest-flask==1.3.0",
        "pytest==9.0.3"
]

[project.urls]
Homepage = "https://www.uu.nl/en/research/yoda"
Documentation = "https://utrechtuniversity.github.io/yoda/"
Repository = "https://github.com/utrechtuniversity/yoda"
Issues = "https://github.com/utrechtuniversity/yoda/issues"

[build-system]
requires = ["setuptools >= 82.0.1", "setuptools_scm[toml]>=7"]
build-backend = "setuptools.build_meta"

[tool.flake8]
ignore = [
    "E221",
    "E402",
    "W503",
    "W504"
]
import-order-style = "smarkets"
strictness = "short"
docstring_style = "sphinx"
max-line-length = 127
application-import-names = ["yoda_eus.*"]
exclude = [
    "build",
    "templates",
    "venv"
]

[tool.setuptools]
packages = ["yoda_eus"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.mypy]
ignore_missing_imports = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = false
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = false
show_error_codes = true
show_error_context = true
